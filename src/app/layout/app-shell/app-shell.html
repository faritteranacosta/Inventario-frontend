<div class="shell">
  <header class="shell__header">
    <a class="shell__brand" routerLink="/dashboard" aria-label="Ir al panel de Inventario SaaS">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
        <path
          d="M4 4h16v16H4zM8 8h3v3H8zm5 0h3v3h-3zM8 13h3v3H8zm5 0h3v3h-3z"
          stroke="currentColor"
          stroke-width="1.8"
        />
      </svg>
      <span>Inventario <strong>SaaS</strong></span>
    </a>
    <nav class="shell__nav" aria-label="Navegación del panel">
      <a routerLink="/dashboard" routerLinkActive="shell__link--active">Resumen</a>
      <a routerLink="/products" routerLinkActive="shell__link--active">Productos</a>
      <a routerLink="/sales" routerLinkActive="shell__link--active">Ventas</a>
    </nav>
    <div class="shell__account">
      <span class="shell__user">{{ auth.user()?.email ?? 'Usuario' }}</span>
      <button type="button" (click)="auth.logout()">Cerrar sesión</button>
    </div>
  </header>
  <main class="shell__content">
    <router-outlet />
  </main>
</div>
