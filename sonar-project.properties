# Configuración de análisis SonarQube / SonarCloud.
# Ejecutar con: npm run sonar  (requiere SONAR_TOKEN y sonar-scanner instalado)

sonar.projectKey=inventario-frontend
sonar.projectName=Inventario Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/dist/**,**/*.mock.ts

# Cobertura (generar antes con: npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Para SonarCloud, definir además:
# sonar.organization=<tu-organizacion>
# sonar.host.url=https://sonarcloud.io
